# Minis 参考构建（Codemagic，iOS 模拟器截图用）
#
# 只为在模拟器里跑起真 Minis、截几张对照图：不签名、不出包、不改源码。
# 流程照 BUILDING.md：子模块 → xcconfig 模板 → 工具链 → 原生依赖
# （--simulator）→ 模拟器构建 → 安装启动截图。
# 首次构建约 30–60 分钟（FFmpeg / iSH 从源码编），Codemagic 免费档
# 每月 500 分钟，注意用量。不自动触发，手动跑。

workflows:
  ios-sim-reference:
    name: Minis iOS simulator reference
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      xcode: latest
    scripts:
      - name: 子模块（iSH / PRoot）
        script: git submodule update --init --recursive
      - name: 构建期配置模板
        script: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig
      - name: 工具链
        script: |
          brew install meson ninja llvm lld libarchive pkg-config
          command -v go >/dev/null || brew install go
          xcodebuild -downloadComponent MetalToolchain || echo "Metal toolchain unavailable, continuing (FFmpeg drops one filter)"
      - name: 原生依赖（模拟器版，顺序不能换）
        script: |
          set -euo pipefail
          ./deps/build_lame.sh --simulator
          ./deps/build_ffmpeg.sh --simulator
          # ish 内核 vdso 用 -fuse-ld=lld：裸 clang 必须解析到 brew llvm 的
          # clang + ld.lld（Xcode 自带 clang 不认识 lld，构建 #3 报错于此）。
          # 注意：brew 的 llvm 23 起不再自带 lld（构建 #4 日志：
          # "LLD and LLDB are now provided in separate formulae"），
          # ld.lld 来自单独的 lld formula（工具链步已装）。
          # 只给这一步加 PATH，不影响其它依赖的工具链。
          LLVM_BIN=""
          for d in /opt/homebrew/opt/llvm/bin /usr/local/opt/llvm/bin; do
            if [ -x "$d/clang" ]; then LLVM_BIN="$d"; break; fi
          done
          LLD_BIN=""
          for d in /opt/homebrew/opt/lld/bin /usr/local/opt/lld/bin; do
            if [ -x "$d/ld.lld" ]; then LLD_BIN="$d"; break; fi
          done
          test -n "$LLVM_BIN" || { echo "FATAL: brew llvm clang not found"; exit 1; }
          test -n "$LLD_BIN" || { echo "FATAL: ld.lld not found (brew install lld)"; exit 1; }
          PATH="$LLVM_BIN:$LLD_BIN:$PATH" ./deps/build_ish.sh --simulator
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh
          # 依赖产物验收：任一缺失都直接失败，别等 xcodebuild 报
          # ish.h 不存在这种误导性错误。头文件是 build_ish.sh 真生成的
          # （umbrella + 从 ish 源码拷过来的），不是桩。
          for f in deps/include/ish/ish.h deps/include/ish/fs/devices.h \
                   deps/libs/iphonesimulator/libish.a deps/libs/iphonesimulator/libish_emu.a \
                   deps/libs/iphonesimulator/libfakefs.a deps/libs/iphonesimulator/libish_aot.a; do
            test -f "$f" || { echo "FATAL: missing $f (build_ish.sh should have produced it)"; exit 1; }
          done
          # 模拟器版：umbrella 在 frameworks/iphonesimulator/ 下，Xcode 链的是
          # frameworks/*.xcframework（build_ffmpeg.sh 的 make_xcframeworks 注释）。
          # deps/frameworks/FFmpeg.framework 只在设备版才存在，别查它。
          test -d deps/frameworks/iphonesimulator/FFmpeg.framework || { echo "FATAL: missing deps/frameworks/iphonesimulator/FFmpeg.framework (build_ffmpeg.sh)"; exit 1; }
          test -d deps/frameworks/FFmpeg.xcframework || { echo "FATAL: missing deps/frameworks/FFmpeg.xcframework (build_ffmpeg.sh)"; exit 1; }
          test -d deps/frameworks/Rclone.xcframework || { echo "FATAL: missing deps/frameworks/Rclone.xcframework (build_rclone_ios.sh)"; exit 1; }
          echo "dep outputs OK"
      - name: 模拟器构建并截图
        script: |
          set -e
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for rt,devs in d['devices'].items():
              if 'iOS' not in rt: continue
              for dev in devs:
                  if 'iPhone' in dev['name'] and dev.get('isAvailable', True):
                      print(dev['udid']); raise SystemExit
          ")
          echo "SIM=$SIM_UDID"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -destination "id=$SIM_UDID" -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build
          APP=$(find build-sim/Build/Products -name "Minis.app" -maxdepth 3 | head -1)
          xcrun simctl install "$SIM_UDID" "$APP"
          xcrun simctl launch "$SIM_UDID" com.openminis.app
          sleep 15
          xcrun simctl io "$SIM_UDID" screenshot minis-home.png
          xcrun simctl terminate "$SIM_UDID" com.openminis.app || true
          # 尽力一试：--uitest-message-list 是 MessageListTestView 的启动参数，
          # 但源码里没有任何启动路由指向它（只能从 Debug 菜单点进去），
          # 这张大概率和上一张一样，只作备查。
          xcrun simctl launch "$SIM_UDID" com.openminis.app -- --uitest-message-list
          sleep 5
          xcrun simctl io "$SIM_UDID" screenshot minis-message-list.png
          ls -lh minis-home.png minis-message-list.png
    artifacts:
      - minis-home.png
      - minis-message-list.png
